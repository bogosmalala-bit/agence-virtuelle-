<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion Facebook Reussie</title>
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(59, 130, 246, 0.2);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 { font-size: 18px; margin: 0 0 8px; color: #60a5fa; }
    p { font-size: 13px; color: #94a3b8; margin: 0; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2>Connexion Facebook en cours...</h2>
  <p>Fampidirana ny kaonty sy ny Pages Facebook...</p>

  <script>
    (function() {
      try {
        var hash = window.location.hash.substring(1);
        var search = window.location.search.substring(1);
        var params = new URLSearchParams(hash || search);
        
        var accessToken = params.get('access_token');
        var code = params.get('code');
        var error = params.get('error') || params.get('error_description');

        if (window.opener) {
          if (accessToken) {
            window.opener.postMessage({
              type: 'FB_OAUTH_TOKEN',
              accessToken: accessToken
            }, '*');
          } else if (code) {
            window.opener.postMessage({
              type: 'FB_OAUTH_CODE',
              code: code
            }, '*');
          } else if (error) {
            window.opener.postMessage({
              type: 'FB_OAUTH_ERROR',
              error: error
            }, '*');
          }
          setTimeout(function() {
            window.close();
          }, 800);
        } else {
          // If not in popup, redirect to homepage
          window.location.href = '/?fb_auth=done';
        }
      } catch (e) {
        console.error('Error handling popup redirect:', e);
      }
    })();
  </script>
</body>
</html>
